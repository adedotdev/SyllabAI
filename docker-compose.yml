services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: syllabai
      POSTGRES_USER: syllabai
      POSTGRES_PASSWORD: syllabai
    ports:
      # Host port 5433, not 5432 -- avoids colliding with a native Postgres
      # install already listening on 5432 on this machine. Container-internal
      # port stays 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
